<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Flowers</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://i.pinimg.com/originals/bd/14/d5/bd14d5d77d1a3e05f465bd220998116d.gif');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white; /* Para garantir contraste no texto */
        }

        h1 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Melhor contraste no título */
        }

        .button {
            display: flex;
            justify-content: center;
            gap: 20px; /* Espaço entre os botões */
        }

        .button a {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            background-color: rgba(255, 105, 180, 0.8); /* Fundo semi-transparente */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s;
        }

        .button a:hover {
            background-color: red;
            transform: scale(1.1); /* Efeito de zoom ao passar o mouse */
        }

        #buttonN {
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Me dê o número</h1>
    <div class="button">
        <a href="flower.html" id="buttonS">S</a>
        <a href="#" id="buttonN">N</a>
    </div>

    <script>
        // Seleciona o botão "N"
        const buttonN = document.getElementById('buttonN');
        const buttonS = document.getElementById('buttonS');

        // Adiciona um evento de clique ao botão "N"
        buttonN.addEventListener('click', () => {
            // Esconde o botão "N"
            buttonN.style.display = 'none';
        });
    </script>
</body>
</html>
